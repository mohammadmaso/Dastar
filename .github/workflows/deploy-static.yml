name: Deploy Static to GitHub Pages

# This workflow deploys a CLIENT-ONLY version to GitHub Pages
# API routes are removed and AI calls happen directly from the browser
# Users MUST provide their own OpenAI API keys in Settings

on:
  push:
    branches:
      - gh-pages-static  # Use a separate branch for static deployment
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Remove API routes (client-only mode)
        run: |
          rm -rf app/api

      - name: Update next.config.ts for static export
        run: |
          cat > next.config.mjs << 'EOF'
          import withPWA from "@ducanh2912/next-pwa";

          const nextConfig = {
            output: 'export',
            basePath: process.env.NEXT_PUBLIC_BASE_PATH || "",
            assetPrefix: process.env.NEXT_PUBLIC_BASE_PATH || "",
            images: {
              unoptimized: true,
            },
            trailingSlash: true,
          };

          export default withPWA({
            dest: "public",
            disable: true,
          })(nextConfig);
          EOF

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - name: Verify build output
        run: |
          if [ ! -d "./out" ]; then
            echo "Error: ./out directory does not exist after build"
            echo "Build may have failed. Checking for .next directory..."
            ls -la
            exit 1
          fi
          echo "Build output directory exists"
          ls -la ./out

      - name: Add .nojekyll file
        run: touch ./out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
